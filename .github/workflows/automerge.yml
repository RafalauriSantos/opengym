# Turns on squash auto-merge for every pull request that is opened or marked ready.
# GitHub then merges it by itself once the required checks (api, web) pass.
# The rule itself lives in the ruleset "main protection"; see docs/DECISIONS.md (ADR-008).
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
